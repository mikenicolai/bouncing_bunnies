<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painted fish and coral reefs</title><style>
body{margin:0;padding:14px;background:#143342;color:#effff1;font:16px system-ui}main{max-width:1100px;margin:auto}h1{margin:0 0 8px;font-size:25px}p{margin:0 0 12px;line-height:1.5}button,a{display:inline-block;font:inherit;padding:9px 14px;border:0;border-radius:9px;background:#b9ded0;color:#173d47;text-decoration:none;margin:0 6px 10px 0;cursor:pointer}button:disabled{opacity:.5}iframe{display:block;box-sizing:border-box;width:100%;height:660px;border:1px solid #749c94;border-radius:12px}.artwork{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.artwork figure{margin:0;padding:10px;text-align:center;background:#8acac5;border-radius:12px;color:#173d47}.artwork img{display:block;width:100%;height:240px;object-fit:contain}.artwork figcaption{padding-top:8px}@media(max-width:600px){body{padding:10px}iframe{height:75dvh}.artwork{grid-template-columns:1fr}.artwork img{height:260px}}
</style></head><body><main><h1>Painted reef life</h1><p>Friendly fish, branching coral and flowing sea grass in the game's painted style. Coral and plant roots sit on the sloping seabed. This preview keeps normal progress and coins unchanged.</p><nav><button disabled data-scene="shallows">Shallow water</button><button disabled data-scene="reef">Rocky reef</button><button disabled data-scene="cave">Deep cave</button><button disabled id="pause">Pause animation</button><a href="../index.html">Play the game</a></nav><iframe src="../index.html" title="Painted fish and rooted coral in the game"></iframe><div class="artwork"><figure><img src="../assets/reef-fish-v1.png" alt="Four painted reef fish colours"><figcaption>Fish</figcaption></figure><figure><img src="../assets/reef-coral-v1.png" alt="Four branching coral clusters"><figcaption>Coral</figcaption></figure><figure><img src="../assets/reef-seagrass-v1.png" alt="Olive and teal sea grass"><figcaption>Sea grass</figcaption></figure></div></main><script>
const frame=document.querySelector('iframe');let ready=false,paused=false,last=0;
function show(scene){if(!ready)return;const s={shallows:{x:1500,y:348,cx:1340,cy:170},reef:{x:2990,y:780,cx:2760,cy:650},cave:{x:9020,y:1180,cx:8760,cy:1080}}[scene];frame.contentWindow.eval(`beginDeveloperSession();level='water';start();fallbackFullscreen=true;syncFullscreen();soundOn=false;state='review';player.inWater=true;player.x=${s.x};player.y=${s.y};player.vx=player.vy=0;player.invincible=0;cameraX=${s.cx};cameraY=${s.cy};waterTime=2;render(0);`);}
frame.onload=async()=>{const style=frame.contentDocument.createElement('style');style.textContent='html,body{margin:0;padding:0}.game-shell,main{width:100%;max-width:none;padding:0;margin:0}header,footer{display:none}.game-frame{border:0;border-radius:0;box-shadow:none}.game-frame:not(.expanded){min-height:0}';frame.contentDocument.head.append(style);try{await frame.contentWindow.eval('Promise.all([...Object.values(WATER_REEF_ART).map(a=>a.image),sandyPitSheet,waterCaveSheet,swimSheet].map(i=>i.decode()))');ready=true;document.querySelectorAll('button').forEach(b=>b.disabled=false);show('shallows');}catch(e){console.error(e);}};
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>show(b.dataset.scene));document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume animation':'Pause animation';};
function tick(t){if(ready&&!paused)frame.contentWindow.eval(`waterTime+=${Math.min(.033,(t-last)/1000||0)}`);last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
