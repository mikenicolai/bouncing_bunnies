<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Living reef and painted bunny coins</title><style>
body{margin:0;padding:14px;background:#143342;color:#effff1;font:16px system-ui}main{max-width:1100px;margin:auto}h1{margin:0 0 8px;font-size:25px}p{margin:0 0 12px;line-height:1.5}button,a{display:inline-block;font:inherit;padding:9px 14px;border:0;border-radius:9px;background:#b9ded0;color:#173d47;text-decoration:none;margin:0 6px 10px 0;cursor:pointer}button:disabled{opacity:.5}iframe{display:block;box-sizing:border-box;width:100%;height:660px;border:1px solid #749c94;border-radius:12px}.artwork{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.artwork figure{margin:0;padding:10px;text-align:center;background:#8acac5;border-radius:12px;color:#173d47}.artwork img{display:block;width:100%;height:240px;object-fit:contain}.artwork figcaption{padding-top:8px}.artwork .turtles{grid-column:1/-1}.turtles canvas{width:100%;max-width:680px;height:auto}@media(max-width:600px){body{padding:10px}iframe{height:75dvh}.artwork{grid-template-columns:1fr}.artwork img{height:260px}}
</style></head><body><main><h1>Painted reef life</h1><p>Fish and turtles spread apart, swim around Benny and turn around the reef. Watch Benny swim through the school, or inspect the matching painted gold coins. This preview keeps normal progress and coins unchanged.</p><nav><button disabled data-scene="school">Swim through a school</button><button disabled data-scene="shallows">Shallow water</button><button disabled data-scene="reef">Rocky reef</button><button disabled data-scene="cave">Deep cave</button><button disabled data-scene="turtle">Swimming turtle</button><button disabled id="pause">Pause animation</button><a href="../index.html">Play the game</a></nav><iframe src="../index.html" title="Painted fish and rooted coral in the game"></iframe><div class="artwork"><figure><img src="../assets/reef-fish-v1.png" alt="Four painted reef fish colours"><figcaption>Fish</figcaption></figure><figure><img src="../assets/reef-coral-v1.png" alt="Four branching coral clusters"><figcaption>Coral</figcaption></figure><figure><img src="../assets/reef-seagrass-v1.png" alt="Olive and teal sea grass"><figcaption>Sea grass</figcaption></figure><figure><img src="../assets/painted-coin-v1.png" alt="Painted gold coin embossed with a bunny"><figcaption>Gold bunny coin · collectibles and wallet</figcaption></figure><figure class="turtles"><canvas id="turtleComparison" width="680" height="250" aria-label="Forest and swimming turtles in the same painted style"></canvas><figcaption>Matching forest and swimming turtles</figcaption></figure></div></main><script>
const frame=document.querySelector('iframe');let ready=false,paused=false,last=0,sceneName='shallows';
function show(scene){if(!ready)return;sceneName=scene;const s={school:{x:1740,y:400,cx:1520,cy:280},shallows:{x:1500,y:348,cx:1340,cy:170},reef:{x:2990,y:780,cx:2760,cy:650},cave:{x:9020,y:1180,cx:8760,cy:1080},turtle:{x:2430,y:650,cx:2020,cy:470}}[scene];frame.contentWindow.eval(`beginDeveloperSession();level='water';start();fallbackFullscreen=true;syncFullscreen();soundOn=false;state='review';player.inWater=true;player.x=${s.x};player.y=${s.y};player.vx=player.vy=0;player.invincible=0;cameraX=${s.cx};cameraY=${s.cy};waterTime=2;resetWaterReefLife();render(0);`);}
frame.onload=async()=>{const style=frame.contentDocument.createElement('style');style.textContent='html,body{margin:0;padding:0}.game-shell,main{width:100%;max-width:none;padding:0;margin:0}header,footer{display:none}.game-frame{border:0;border-radius:0;box-shadow:none}.game-frame:not(.expanded){min-height:0}';frame.contentDocument.head.append(style);try{await frame.contentWindow.eval('Promise.all([...Object.values(WATER_REEF_ART).map(a=>a.image),PAINTED_COIN.image,sandyPitSheet,waterCaveSheet,swimSheet,EARTH_ANIMAL_ART.turtle.image].map(i=>i.decode()))');ready=true;document.querySelectorAll('button').forEach(b=>b.disabled=false);show('shallows');drawTurtleComparison();}catch(e){console.error(e);}};
function drawTurtleComparison(){
 const c=document.querySelector('#turtleComparison'),p=c.getContext('2d'),land=frame.contentWindow.eval('EARTH_ANIMAL_ART.turtle'),sea=frame.contentWindow.eval('WATER_REEF_ART.turtle'),f=sea.frames[0];
 p.fillStyle='#173d47';p.font='bold 17px system-ui';p.textAlign='center';p.fillText('Forest turtle',170,24);p.fillText('Swimming turtle',510,24);
 const width=300,lh=width*land.sh/land.sw,sh=width*f.sh/f.sw;
 p.drawImage(land.image,land.sx,land.sy,land.sw,land.sh,20,220-lh,width,lh);
 p.drawImage(sea.image,f.sx,f.sy,f.sw,f.sh,360,220-sh,width,sh);
}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>show(b.dataset.scene));document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume animation':'Pause animation';};
function tick(t){if(ready&&!paused){const dt=Math.min(.033,(t-last)/1000||0);frame.contentWindow.eval(`waterTime+=${dt};${sceneName==='school'?"const schoolHome=waterFishPath(0,2);player.x=schoolHome.x+Math.sin(waterTime*.9)*170-player.w/2;player.y=schoolHome.y-player.h/2+Math.sin(waterTime*1.2)*25;player.facing=Math.cos(waterTime*.9)>=0?1:-1;":''}state='playing';updateWaterReefLife(${dt});state='review';`);}last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
