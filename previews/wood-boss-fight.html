<main><h1>The Wildwood final fight</h1><p>Five hearts on each form. Punch with X / F, move with the arrows, jump with Space. Jump over earthquake waves and leave the red patch before mountains grow. The normal route reaches this arena after the last woodland branch.</p><p><button id="restart">Restart the fight</button> <a href="../index.html">Open the complete game</a> <a href="wood-boss-animation.html">Animation study</a></p><iframe src="../index.html" title="Playable Wildwood boss arena" allow="fullscreen"></iframe></main>
<script>
const frame=document.querySelector('iframe');
function startFight(){frame.contentWindow.eval("level='earth';start();soundOn=false;player.x=7030;player.y=EARTH_ARENA.floor-58;player.vx=0;player.vy=0;player.onGround=true;updateEarthBoss(0);cameraX=Math.max(0,player.x-W*.38);cameraY=EARTH_ARENA.floor-playfieldHeight()*.8;");frame.contentWindow.focus();}
frame.onload=startFight;document.querySelector('#restart').onclick=startFight;
</script></html>
