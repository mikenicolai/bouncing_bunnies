<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painted bosses · vine and smooth movement</title>
<style>body{margin:0;background:#172b25;color:#eaf1df;font:16px system-ui}main{max-width:1100px;margin:auto;padding:18px}h1{margin:0 0 10px;font-size:26px}p{color:#bdd1b9;line-height:1.5}button,a{display:inline-block;font:inherit;color:#eaf1df;background:#355740;padding:10px 14px;border:1px solid #64876c;border-radius:8px;cursor:pointer;text-decoration:none;margin:0 5px 8px 0}iframe{width:100%;height:720px;border:1px solid #64876c;border-radius:12px;display:block}#knife{width:180px;height:80px;vertical-align:middle}@media(max-width:600px){main{padding:12px}iframe{height:80vh}}</style>
<main><h1>Woodland giant and Tempest</h1><p>The giant has eight hearts. Escape its vine by jumping or throwing a ready knife. Leave the red patch before the spikes rise beneath it. X / F throws; Z equips or stows. Your three knives return after five seconds.</p><nav><button data-scene="giant">Giant fight</button><button data-scene="vine">Vine reach</button><button data-scene="spikes">Targeted ground spikes</button><button data-scene="tempest">Tempest</button><a href="../index.html">Play the complete game</a></nav><p>The knife from your drawing: <canvas id="knife" width="360" height="160"></canvas></p><iframe src="../index.html" title="Painted bosses in the actual game" allow="fullscreen"></iframe></main>
<script>
const frame=document.querySelector('iframe');
function show(scene){
 const air=scene==='tempest';frame.contentWindow.eval(`level='${air?'air':'earth'}';start();soundOn=false;player.x=${air?5050:7190};player.y=${air?'airPlatforms[19].y':'EARTH_ARENA.floor'}-58;player.vx=0;player.vy=0;player.onGround=true;${air?"bossAwake=true;windStars.owned=true;windStars.equipped=true;updateTempest(0);":"earthGoblins.forEach(g=>g.alive=false);earthKnives.slots.forEach(k=>k.state='ready');earthKnives.equipped=true;earthBoss.active=true;earthBoss.stage='giant';earthBoss.hp=EARTH_GIANT_HP;"}cameraX=player.x-W*.3;cameraY=player.y-playfieldHeight()*.72;${scene==='vine'?"earthBoss.turn=3;earthBoss.cooldown=0;updateEarthBoss(0);":scene==='spikes'?"earthBoss.turn=2;earthBoss.cooldown=0;updateEarthBoss(0);":''}render(0);`);
 frame.contentWindow.focus();
}
frame.onload=()=>{show('giant');const paint=document.querySelector('#knife').getContext('2d');frame.contentWindow.eval('drawEarthKnife')(180,80,200,-.35,paint);};
document.querySelectorAll('[data-scene]').forEach(button=>button.onclick=()=>show(button.dataset.scene));
</script></html>
