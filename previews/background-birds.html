<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Background birds</title>
<style>
body{margin:0;padding:16px;background:#1b2830;color:#fff7df;font:16px system-ui}h1{margin:0 0 8px;font-size:24px}p{margin:0 0 12px}button{font:inherit;border:0;border-radius:8px;padding:8px 14px;margin:0 6px 12px 0;background:#b8d7c3;color:#243b42;cursor:pointer}iframe{display:block;width:min(1100px,100%);height:760px;border:1px solid #51766b;border-radius:12px}
</style>
<h1>Birds in the background</h1>
<p>Small flocks in Air, occasional birds in Earth and Water, and an empty sky in Fire. Birds stay behind the gameplay.</p>
<button data-world="air">Air</button><button data-world="earth">Earth</button><button data-world="water">Water</button><button data-world="fire">Fire · no birds</button><button id="pause">Freeze frame</button>
<iframe src="../index.html" title="Bouncing Bunnies bird preview"></iframe>
<script>
const frame=document.querySelector('iframe');let ready=false,paused=false,last=0;
function show(world){
 frame.contentWindow.eval(`level='${world}';soundOn=false;start();state='review';cameraX=0;cameraY=0;player.onGround=true;nextBackgroundFlock=0;updateBackgroundBirds(2.8);`);ready=true;
}
frame.addEventListener('load',()=>show('air'));
document.querySelectorAll('[data-world]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.world)));
document.querySelector('#pause').addEventListener('click',e=>{paused=!paused;e.target.textContent=paused?'Resume birds':'Freeze frame';});
function tick(t){if(ready&&!paused)frame.contentWindow.eval(`updateBackgroundBirds(${Math.min(.033,(t-last)/1000||0)})`);last=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script>
</html>
