<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuous shoreline sand</title><style>body{margin:0;padding:14px;background:#143342;color:#effff1;font:16px system-ui}main{max-width:1100px;margin:auto}h1{margin:0 0 8px;font-size:25px}p{margin:0 0 12px;line-height:1.5}button,a{display:inline-block;font:inherit;padding:9px 14px;border:0;border-radius:9px;background:#b9ded0;color:#173d47;text-decoration:none;margin:0 6px 10px 0;cursor:pointer}button:disabled{opacity:.5}iframe{display:block;box-sizing:border-box;width:100%;height:660px;border:1px solid #749c94;border-radius:12px}@media(max-width:600px){body{padding:10px}iframe{height:75dvh}}</style></head><body><main><h1>Continuous shoreline sand</h1><p>The dry beach and sea floor share continuous painted sand, with a soft wet-sand transition at the shore. Ground remains textured throughout its depth. These views keep normal coins and progress unchanged.</p><nav><button disabled data-scene="join">Shoreline join</button><button disabled data-scene="dry">Deep dry sand</button><button disabled data-scene="wet">Deep seabed</button><a href="../index.html">Play the game</a></nav><iframe src="../index.html" title="Water sand texture in the actual game"></iframe></main><script>
const frame=document.querySelector('iframe');let ready=false;
function show(scene){if(!ready)return;const s={join:{x:1510,y:348,cx:1150,cy:180,water:true},dry:{x:1000,y:292,cx:700,cy:500,water:false},wet:{x:2940,y:950,cx:2700,cy:950,water:true}}[scene];frame.contentWindow.eval(`beginDeveloperSession();level='water';start();fallbackFullscreen=true;syncFullscreen();soundOn=false;state='review';player.inWater=${s.water};player.x=${s.x};player.y=${s.y};player.vx=player.vy=0;cameraX=${s.cx};cameraY=${s.cy};waterTime=2;render(0);`);}
frame.onload=async()=>{const style=frame.contentDocument.createElement('style');style.textContent='html,body{margin:0;padding:0}.game-shell,main{width:100%;max-width:none;padding:0;margin:0}header,footer{display:none}.game-frame{border:0;border-radius:0;box-shadow:none}.game-frame:not(.expanded){min-height:0}';frame.contentDocument.head.append(style);try{await frame.contentWindow.eval('Promise.all([sandyPitSheet,swimSheet,waterCactusSheet,waterCaveSheet,...Object.values(WATER_REEF_ART).map(a=>a.image)].map(i=>i.decode()))');ready=true;document.querySelectorAll('button').forEach(b=>b.disabled=false);show('join');}catch(e){console.error(e);}};document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>show(b.dataset.scene));
</script></body></html>
