<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walking and swimming turtles</title><style>body{margin:0;background:#172c30;color:#fff1cf;font:16px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button{padding:10px;border:0;border-radius:8px;background:#d6e6aa;color:#163b32;font:inherit}canvas{display:block;width:min(100%,720px);margin:auto}iframe{display:block;width:100%;height:65dvh;border:0}</style><header><b>Painted turtle animation</b><button id="land" disabled>Forest turtle ride</button><button id="sea" disabled>Underwater swimming</button></header><canvas id="compare" width="720" height="200"></canvas><iframe title="Turtle game animation preview" src="../index.html"></iframe><script>
const frame=document.querySelector('iframe'),paint=document.querySelector('#compare').getContext('2d');let ready=false;
function show(world){const w=frame.contentWindow;w.eval("beginDeveloperSession();level='"+world+"';start();soundOn=false;fallbackFullscreen=true;syncFullscreen();");if(world==='earth')w.eval("player.x=earthTurtle.x+72;player.y=earthGroundAt(earthTurtle.x)-58;player.onGround=true;toggleEarthTurtle();cameraX=450;cameraY=earthGroundAt(earthTurtle.x)-playfieldHeight()*.82;");else w.eval("player.x=2430;player.y=650;player.inWater=true;player.invincible=999;cameraX=2020;cameraY=470;");}
frame.onload=async()=>{await frame.contentWindow.eval('Promise.all(Object.values(TURTLE_ANIMATION).map(a=>a.image.decode()))');ready=true;document.querySelectorAll('button').forEach(b=>b.disabled=false);show('earth');};
document.querySelector('#land').onclick=()=>show('earth');document.querySelector('#sea').onclick=()=>show('water');
function loop(){paint.fillStyle='#172c30';paint.fillRect(0,0,720,200);paint.fillStyle='#fff1cf';paint.font='bold 16px system-ui';paint.textAlign='center';paint.fillText('Walking legs · steady shell',180,22);paint.fillText('Swimming strokes',540,22);if(ready){const w=frame.contentWindow,time=w.eval("level==='earth'?earthTime:waterTime"),walk=w.eval('turtleCyclePainting("walk",'+time*48/54+')'),swim=w.eval('turtleCyclePainting("swim",'+time*.75+')');if(walk)paint.drawImage(walk,28,48,304,160);if(swim)paint.drawImage(swim,436,34,208,160);}requestAnimationFrame(loop);}loop();
</script></html>
