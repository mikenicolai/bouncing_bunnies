<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sea-floor pirate animation</title>
  <style>
    body{margin:0;background:#122b42;color:#f3f9ee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}
    main{width:min(940px,96vw);padding:20px}
    h1{font-size:26px;margin:0 0 7px}p{margin:0 0 15px;color:#b9e8e7;line-height:1.45}
    canvas{width:100%;height:auto;display:block;border:2px solid #8bd6cd;border-radius:16px;background:#167b9d}
    button{margin-top:12px;background:#f4d393;color:#173143;border:0;border-radius:9px;font:700 15px system-ui;padding:10px 18px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Your sea-floor pirate</h1>
    <p>Left: small planted shuffle. Right: hook reaches left, then the cutlass swings across and to the right. Both keep their feet on the sand.</p>
    <canvas id="preview" width="900" height="470" aria-label="Animated pirate shuffle and weapon swing"></canvas>
    <button id="toggle" type="button">Pause animation</button>
  </main>
  <script>
    const canvas=document.querySelector('#preview'),ctx=canvas.getContext('2d');
    const sheet=new Image();sheet.src='../assets/pirate-skeleton-v1.png';
    let paused=false,held=0;
    document.querySelector('#toggle').addEventListener('click',event=>{
      paused=!paused;event.currentTarget.textContent=paused?'Play animation':'Pause animation';
    });
    function drawPirate(frame,x,feet){
      const scale=.62,baseline=frame<4?458:427;
      ctx.drawImage(sheet,(frame%4)*384,Math.floor(frame/4)*512,384,512,
        x-192*scale,feet-baseline*scale,384*scale,512*scale);
    }
    function frame(ms){
      if(!paused)held=ms/1000;
      const sea=ctx.createLinearGradient(0,0,0,420);sea.addColorStop(0,'#45bbd0');sea.addColorStop(1,'#145278');
      ctx.fillStyle=sea;ctx.fillRect(0,0,900,470);
      for(let i=0;i<9;i++){
        ctx.fillStyle='rgba(220,255,238,.06)';ctx.beginPath();ctx.moveTo(i*125,0);ctx.lineTo(i*125+55,0);ctx.lineTo(i*125+140,405);ctx.lineTo(i*125-60,405);ctx.fill();
      }
      ctx.fillStyle='#e5d09c';ctx.fillRect(0,405,900,65);
      ctx.fillStyle='#f2dfaa';ctx.fillRect(0,405,900,9);
      ctx.fillStyle='#ecfffb';ctx.font='700 18px system-ui';ctx.textAlign='center';
      ctx.fillText('PLANTED SHUFFLE',225,47);ctx.fillText('HOOK + CUTLASS SWING',675,47);
      if(sheet.complete&&sheet.naturalWidth){
        drawPirate(Math.floor(held*3.2)%4,225,407);
        drawPirate(4+Math.floor(held*4.8)%4,675,407);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
