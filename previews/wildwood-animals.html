<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painted Wildwood wildlife · turtle ride</title><style>body{margin:0;background:#17382c;color:#fff8df;font:16px system-ui}header{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{background:#dbe9b2;color:#17382c;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}button:disabled{opacity:.4}p{margin:0;max-width:58em}iframe{display:block;width:100%;height:calc(100dvh - 110px);min-height:350px;border:0}</style></head><body><header><p>Painted panda, birds and turtle. Jump onto the shell for a ride; Jump again to hop off. This practice page keeps your saved progress and wallet unchanged.</p><button disabled id="clearing">Opening clearing</button><button disabled id="ride">Turtle ride</button></header><iframe src="../index.html" title="Wildwood wildlife practice"></iframe><script>
const frame=document.querySelector('iframe');
function clearing(){frame.contentWindow.eval("beginDeveloperSession();level='earth';start();fallbackFullscreen=true;syncFullscreen();soundOn=false;player.x=earthTurtle.x+82;player.y=earthGroundAt(earthTurtle.x)-player.h;player.onGround=true;cameraX=Math.max(0,player.x-W*.7);cameraY=earthGroundAt(earthTurtle.x)-playfieldHeight()*.8;render(0);");}
frame.onload=async()=>{
 const style=frame.contentDocument.createElement('style');style.textContent='html,body{margin:0;padding:0;background:#17382c}.game-shell,main{width:100%;max-width:none;padding:0;margin:0}header,footer{display:none}.game-frame{border:0;border-radius:0;box-shadow:none}.game-frame:not(.expanded){min-height:0}';frame.contentDocument.head.append(style);
 try{await frame.contentWindow.eval('Promise.all([...Object.values(EARTH_ANIMAL_ART).map(a=>a.image),earthTreeSheet,earthGroundSheet,...Object.values(PAINTED_BUNNY).flatMap(s=>[s.plain,s.quiver])].map(i=>i.decode()))');clearing();document.querySelectorAll('button').forEach(b=>b.disabled=false);}catch(e){console.error(e);}
};
document.querySelector('#clearing').onclick=()=>{clearing();frame.contentWindow.focus();};
document.querySelector('#ride').onclick=()=>{clearing();frame.contentWindow.eval('toggleEarthTurtle()');frame.contentWindow.focus();};
</script></body></html>
