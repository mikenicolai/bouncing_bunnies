let source;async function load(live=false){source??=await(await fetch('../index.html')).text();const scene=document.querySelector('select').value;
const fixture="level='air';soundOn=false;resetGame();overlay.classList.add('hidden');"+scenes[scene]+(live?"requestAnimationFrame(loop);":"setTimeout(()=>render(1),300);");

</script>
